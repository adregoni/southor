name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-package:
    name: Build .NET publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish web application
        run: >-
          dotnet publish src/ST.Afiliado.Web/ST.Afiliado.Web.csproj
          --configuration Release
          --output artifacts/publish

      - name: Create ZIP package
        run: zip -qr ST.Afiliado.Web.zip publish
        working-directory: artifacts

      - name: Upload publish package
        uses: actions/upload-artifact@v7
        with:
          name: ST.Afiliado.Web-${{ github.sha }}
          path: artifacts/ST.Afiliado.Web.zip
          if-no-files-found: error
          retention-days: 30

  publish-container:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: publish-package
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
